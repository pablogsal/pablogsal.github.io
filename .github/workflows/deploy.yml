name: Deploy to GitHub Pages

on:
  # Every push to main deploys the site.
  push:
    branches: [ main ]
  # Manual runs, and runs started by the "Refresh data snapshots" workflow.
  workflow_dispatch:
  # A weekly rebuild keeps values computed at build time (like years as a
  # core developer) current, even when no data changed.
  schedule:
    - cron: "0 6 * * 1"

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Do not cancel a deployment that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
